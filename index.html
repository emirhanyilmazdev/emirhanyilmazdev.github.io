<!DOCTYPE html>
<html lang="tr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Emirhan Yılmaz | FiveM Developer</title>
    <style>
        body {
            background-color: #0d1117;
            color: #c9d1d9;
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
            margin: 0;
            padding: 40px 20px;
            display: flex;
            justify-content: center;
        }
        .container {
            max-width: 600px;
            width: 100%;
            text-align: center;
        }
        .profile-img {
            width: 100px;
            height: 100px;
            border-radius: 50%;
            border: 2px solid #58a6ff;
            margin-bottom: 15px;
        }
        h1 { color: #f0f6fc; margin-bottom: 5px; }
        p.tagline { color: #8b949e; margin-top: 0; }
        .card {
            background: #161b22;
            border: 1px solid #30363d;
            border-radius: 8px;
            padding: 15px;
            margin: 15px 0;
            text-align: left;
        }
        .card h3 { color: #58a6ff; margin-top: 0; }
        .btn {
            display: inline-block;
            background: #238636;
            color: white;
            padding: 10px 20px;
            text-decoration: none;
            border-radius: 6px;
            font-weight: bold;
            margin-top: 10px;
        }
    </style>
</head>
<body>
    <div class="container">
        <h1>Emirhan Yılmaz</h1>
        <p class="tagline">FiveM Script & Systems Developer</p>
        
        <div class="card">
            <h3>🚀 FiveM Projeleri & Scriptler</h3>
            <p>Özel optimize edilmiş scriptler, UI tasarımları ve sunucu altyapıları geliştiriyorum.</p>
        </div>

        <div class="card">
            <h3>💬 İletişim</h3>
            <p>Sipariş ve detaylı bilgi için Discord üzerinden ulaşabilirsiniz.</p>
            <a href="https://discord.com" class="btn" target="_blank">Discord Sunucum</a>
        </div>
    </div>
</body>
</html>
